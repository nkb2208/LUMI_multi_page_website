<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUMI Body</title><link rel="stylesheet" href="styles.css">
<script src="data.js"></script>
<script src="service.js"></script>
<script src="app.js"></script>
</head><body>
<nav class="nav"><a class="logo" href="index.html">LUMI</a><div class="navlinks"><a href="index.html">Home</a><a href="hair.html">Hair</a><a href="face.html">Face</a><a href="outfit.html">Outfit</a><a class="active" href="body.html">Body</a><a href="explore.html">Explore</a></div></nav>
<main class="container">
  <div class="eyebrow">① Survey → ② Suggestions → ③ Tutorial</div>
  <h1 style="margin-top:10px;">Body Care</h1>
  <p>Choose exercises and methods that match your goals.</p>
  <div class="grid grid-2">
    <div class="panel">
      <h2>1. Features Survey</h2>
      <div style="margin-bottom:20px;">
        <strong>What is your goal?</strong>
        <div class="pills" style="margin-top:10px;">
          <button class="pill" data-val="curves" onclick="selectPill(this, 'goal', 'body')">Curves</button>
          <button class="pill" data-val="balance" onclick="selectPill(this, 'goal', 'body')">Balance</button>
        </div>
      </div>
      <div>
        <strong>Current body shape?</strong>
        <div class="pills" style="margin-top:10px;">
          <button class="pill" data-val="hourglass" onclick="selectPill(this, 'bodyShape', 'body')">Hourglass</button>
          <button class="pill" data-val="rectangle" onclick="selectPill(this, 'bodyShape', 'body')">Rectangle</button>
        </div>
      </div>
    </div>
    <div class="panel">
      <h2>2. Filter & Suggest</h2>
      <p>The recommendation system will scan exercises and body care data.</p>
      <div class="btn-row"><button class="btn" onclick="submitSurvey('body', 'bodyResults')">See roadmap ✦</button></div>
    </div>
  </div>
  <section id="bodyResults" class="result-area"></section>
</main>
</body></html>
